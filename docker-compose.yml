version: '3.8'

services:
  hugo:
    build: .
    container_name: zerodowntime-blog
    ports:
      - "1313:1313"
    volumes:
      - .:/blog
    # Força a BaseURL local para impedir vazamentos pra url de produção
    command: hugo server --bind 0.0.0.0 -b http://localhost:1313 -D --disableFastRender
